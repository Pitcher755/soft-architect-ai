[pytest]
# Pytest configuration for test suite
# Fix pytest-asyncio deprecation warning (Python 3.12+)
asyncio_default_fixture_loop_scope = function

# Only collect tests from these directories (prevents false positives from app code)
testpaths = tests

# Python files to ignore during test collection
python_files = test_*.py *_test.py

# Directories to completely ignore during test collection
norecursedirs = src .git .tox dist build *.egg venv node_modules infrastructure packages

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    asyncio: marks tests as async (pytest-asyncio)
