name: softarchitect_ai_monorepo
description: SoftArchitect AI - Monorepo root for CI/CD orchestration
version: 0.1.0
publish_to: 'none'

# ============================================================================
# PURPOSE: Monorepo root configuration
# USAGE: flutter test tests/client/ (from root for CI/CD)
# DEPENDENCIES: Minimal (only Flutter SDK required)
# ============================================================================
# For actual app dependencies, see: src/client/pubspec.yaml
# For test dependencies, see: tests/pubspec.yaml
# ============================================================================

# ============================================================================
# ENVIRONMENT & PLATFORM CONFIGURATION
# Required: Dart SDK 3.10.8+ (stable) | Flutter 3.38.0+
# ============================================================================
environment:
  sdk: '>=3.10.8 <4.0.0'
  flutter: '>=3.38.0'

# ============================================================================
# MINIMAL DEPENDENCIES FOR CI/CD ORCHESTRATION
# All app dependencies are managed in src/client/pubspec.yaml
# Test-specific dependencies are in tests/pubspec.yaml
# ============================================================================
dependencies:
  flutter:
    sdk: flutter

# ============================================================================
# DEVELOPMENT DEPENDENCIES
# Minimal tooling for root-level test execution
# ============================================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

# ============================================================================
# FLUTTER CONFIGURATION
# ============================================================================
flutter:
  uses-material-design: true
