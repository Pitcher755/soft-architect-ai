name: Frontend CI Pipeline

on:
  push:
    branches: [main, develop, feature/**]
    paths:
      - 'src/client/**'
      - 'tests/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/client/**'
      - 'tests/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
  workflow_call:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-tests:
    name: Flutter Analysis & Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '' # Dejar vacío para usar la última versión estable
          cache: true
      - run: cd src/client && flutter clean
      - run: cd src/client && flutter pub get
      - run: cd src/client && flutter analyze
      - run: cd tests && flutter test test --coverage 2>/dev/null || echo "No tests found"
      - run: cd src/client && dart format --set-exit-if-changed . || true
