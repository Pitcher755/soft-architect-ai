name: 🐍 Backend CI Pipeline

on:
  push:
    branches: [main, develop, feature/backend-skeleton, feature/rag-vectorization, feature/rag-ingestion-loader, feature/client-filesystem-service, feature/streaming-optimization]
    paths:
      - 'api/**'
      - 'core/**'
      - 'domain/**'
      - 'services/**'
      - 'utils/**'
      - 'src/server/**'
      - 'main.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'src/client/**'
      - 'pubspec.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'api/**'
      - 'core/**'
      - 'domain/**'
      - 'services/**'
      - 'utils/**'
      - 'src/server/**'
      - 'main.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'src/client/**'
      - 'pubspec.yaml'
  workflow_call:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  code-quality:
    name: 🔍 Code Quality (Ruff + Black + MyPy)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff black mypy httpx
      - run: black --check . || true
        continue-on-error: true
      - run: ruff check . || true
        continue-on-error: true
      - run: mypy . --ignore-missing-imports --no-error-summary 2>/dev/null || true
        continue-on-error: true

  unit-tests:
    name: 🧪 Unit Tests (pytest)
    runs-on: self-hosted
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-asyncio pytest-timeout httpx
      - name: Run Backend Unit Tests
        run: pytest tests/python/unit/ -v --cov=services --cov=core --cov-report=xml --timeout=10
      - name: Run Backend Integration Tests
        run: pytest tests/python/integration/ -v --timeout=15
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
        continue-on-error: true

  security-check:
    name: 🔒 Security Scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit safety httpx
      - run: bandit -r src/server/ || true
      - run: safety check --json || true
        continue-on-error: true

  startup-test:
    name: ✨ Startup Verification
    runs-on: self-hosted
    needs: [code-quality, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx
      - run: python -c "from main import app; print('✅ FastAPI app loaded')"
      - run: python -c "from main import app; schema = app.openapi(); print('✅ OpenAPI schema valid')"
