---
name: 🎯 Monorepo CI Master (Orchestrator)

# DISPARADOR: Todo push y PR en main/develop
on:
  push:
    branches:
      - main
      - develop
      - feature/backend-skeleton
      - chore/rag-verification-tools
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Permite solo una ejecución por rama a la vez
concurrency:
  group: ci-master-${{ github.ref }}
  cancel-in-progress: yes

permissions:
  pull-requests: write
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # ORQUESTADOR: Detecta qué cambió y corre solo lo relevante
  # ═══════════════════════════════════════════════════════════════════
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Path Filter
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'api/**'
              - 'core/**'
              - 'domain/**'
              - 'services/**'
              - 'utils/**'
              - 'main.py'
              - 'requirements.txt'
              - 'tests/**'
            frontend:
              - 'src/client/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            docker:
              - 'Dockerfile*'
              - 'infrastructure/**'
              - 'docker-compose.yml'
              - '.dockerignore'
            docs:
              - 'doc/**'
              - 'context/**'
              - 'packages/knowledge_base/**'

  # ═══════════════════════════════════════════════════════════════════
  # DECISIÓN: ¿Ejecutar Backend CI?
  # Nota: Workflows reutilizables funcionan en
  # rama default (develop/main)
  # ═══════════════════════════════════════════════════════════════════
  backend-ci:
    name: 🐍 Backend Pipeline
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop')
    uses: ./.github/workflows/backend-ci.yaml

  # ═══════════════════════════════════════════════════════════════════
  # DECISIÓN: ¿Ejecutar Frontend CI?
  # Nota: Workflows reutilizables funcionan en
  # rama default (develop/main)
  # ═══════════════════════════════════════════════════════════════════
  frontend-ci:
    name: 📱 Frontend Pipeline
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop')
    uses: ./.github/workflows/frontend-ci.yaml

  # ═══════════════════════════════════════════════════════════════════
  # DECISIÓN: ¿Ejecutar Docker Build?
  # Nota: Workflows reutilizables funcionan en
  # rama default (develop/main)
  # ═══════════════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Pipeline
    needs: changes
    if: |
      needs.changes.outputs.docker == 'true' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop')
    uses: ./.github/workflows/docker-build.yaml

  # ═══════════════════════════════════════════════════════════════════
  # RESUMEN FINAL: Dashboard de estado
  # ✨ CORREGIDO: if: always() para ejecutarse
  # incluso si otros se saltan
  # ═══════════════════════════════════════════════════════════════════
  dashboard:
    name: 📊 CI Dashboard
    runs-on: ubuntu-latest
    if: always()
    needs: [changes]

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      - name: 📊 Generate Dashboard
        run: |
          cat > /tmp/ci_dashboard.md << 'EOF'
          # 🎯 SoftArchitect AI - CI Pipeline Dashboard

          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}
          **Author:** ${{ github.actor }}
          **Event:** ${{ github.event_name }}

          ---

          ## 📋 Change Detection

          | Component | Status | Action |
          |-----------|--------|--------|
          | 🐍 Backend | ${{ needs.changes.outputs.backend
            == 'true' && '✅ Changed' || '⏭️ Skipped' }} |
            ${{ needs.changes.outputs.backend == 'true' &&
            'Running Backend CI' || 'No changes detected' }} |
          | 📱 Frontend | ${{ needs.changes.outputs.frontend
            == 'true' && '✅ Changed' || '⏭️ Skipped' }} |
            ${{ needs.changes.outputs.frontend == 'true' &&
            'Running Frontend CI' || 'No changes' }} |
          | 🐳 Docker | ${{ needs.changes.outputs.docker
            == 'true' && '✅ Changed' || '⏭️ Skipped' }} |
            ${{ needs.changes.outputs.docker == 'true' &&
            'Running Docker Build' || 'No changes' }} |
          | 📚 Docs | ${{ needs.changes.outputs.docs
            == 'true' && '✅ Changed' || '⏭️ Skipped' }} |
            Documentation updated |

          ---

          ## 🔄 Pipeline Status

          ### Backend Pipeline
          - **Status:** ${{ job.status }}
          - **Duration:** ~2-3 mins
          - **Checks:**
            - Code Quality (Black, Ruff, MyPy)
            - Unit Tests (pytest)
            - Security Scan (Bandit, Safety)
            - Startup Verification

          ### Frontend Pipeline
          - **Status:** ${{ job.status }}
          - **Duration:** ~3-5 mins
          - **Checks:**
            - Flutter Analysis
            - Widget Tests
            - Desktop Build
            - Dependency Health

          ### Docker Pipeline
          - **Status:** ${{ job.status }}
          - **Duration:** ~2-4 mins
          - **Checks:**
            - Dockerfile Validation
            - Image Build (dry run)
            - Docker Compose Syntax
            - Security Scan (Trivy)
            - Image Size Check

          ---

          ## 🎓 What This Means

          ✅ **GREEN:** Code ready to merge to main
          🟡 **YELLOW:** Review warnings
          🔴 **RED:** Fix before merging

          ---

          ## 🚀 Next Steps

          1. If 🟢 GREEN: Merge with confidence
          2. If 🔴 RED: Click Details on failed job
          3. Fix: `pytest`, `flutter analyze`, `black .`
          4. Push: CI will re-run automatically

          EOF

          cat /tmp/ci_dashboard.md >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment on PR (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const dashboard = fs.readFileSync(
              '/tmp/ci_dashboard.md', 'utf8'
            );
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: dashboard
            });

      - name: 📈 Job Status Summary
        run: |
          echo "## ✅ CI Pipeline Execution Summary" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Monorepo Execution:" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" \
            >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" \
            >> $GITHUB_STEP_SUMMARY
          BE='${{ needs.changes.outputs.backend \
            == "true" && "🟢 Executed" || "⏭️ Skipped" }}'
          FE='${{ needs.changes.outputs.frontend \
            == "true" && "🟢 Executed" || "⏭️ Skipped" }}'
          DO='${{ needs.changes.outputs.docker \
            == "true" && "🟢 Executed" || "⏭️ Skipped" }}'
          echo "| 🐍 Backend | $BE |" \
            >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Frontend | $FE |" \
            >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker | $DO |" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Only relevant pipelines executed" \
            >> $GITHUB_STEP_SUMMARY
