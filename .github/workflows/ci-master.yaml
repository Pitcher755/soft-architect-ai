name: Monorepo CI Master (Orchestrator)

# DISPARADOR: En main/develop y feature branches para PRs
on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Permite solo una ejecución por rama a la vez
concurrency:
  group: ci-master-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # ORQUESTADOR: Detecta qué cambió y corre solo lo relevante
  # ═══════════════════════════════════════════════════════════════════
  changes:
    name: 🔍 Detect Changes
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Path Filter
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'api/**'
              - 'core/**'
              - 'domain/**'
              - 'services/**'
              - 'utils/**'
              - 'src/server/**'
              - 'main.py'
              - 'requirements.txt'
              - 'tests/**'
              - 'pyrightconfig.json'
            frontend:
              - 'src/client/**'
              - 'tests/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
            docker:
              - 'Dockerfile*'
              - 'infrastructure/**'
              - 'docker-compose.yml'
              - '.dockerignore'
            docs:
              - 'doc/**'
              - 'context/**'
              - 'packages/knowledge_base/**'
              - 'README.md'
              - 'AGENTS.md'

  # ═══════════════════════════════════════════════════════════════════
  # Backend Pipeline (always run on feature branches, conditional on main/develop)
  # ═══════════════════════════════════════════════════════════════════
  backend-ci:
    name: 🐍 Backend Pipeline
    needs: changes
    if: needs.changes.outputs.backend == 'true' || startsWith(github.ref, 'refs/heads/feature/')
    uses: ./.github/workflows/backend-ci.yaml

  # ═══════════════════════════════════════════════════════════════════
  # Frontend Pipeline (always run on feature branches, conditional on main/develop)
  # ═══════════════════════════════════════════════════════════════════
  frontend-ci:
    name: 📱 Frontend Pipeline
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || startsWith(github.ref, 'refs/heads/feature/')
    uses: ./.github/workflows/frontend-ci.yaml

  # ═══════════════════════════════════════════════════════════════════
  # Docker Pipeline (always run on feature branches, conditional on main/develop)
  # ═══════════════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Pipeline
    needs: changes
    if: needs.changes.outputs.docker == 'true' || startsWith(github.ref, 'refs/heads/feature/')
    uses: ./.github/workflows/docker-build.yaml

  # ═══════════════════════════════════════════════════════════════════
  # Dashboard: Always show status
  # ═══════════════════════════════════════════════════════════════════
  dashboard:
    name: 📊 CI Dashboard
    runs-on: self-hosted
    if: always()
    needs: [changes, backend-ci, frontend-ci, docker-build]

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      - name: 📊 Generate Dashboard
        run: |
          cat > /tmp/ci_dashboard.md << 'EOF'
          # 🎯 SoftArchitect AI - CI Pipeline Dashboard

          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}
          **Author:** ${{ github.actor }}

          ---

          ## 📋 Change Detection

          | Component | Status |
          |-----------|--------|
          | 🐍 Backend | ${{ needs.changes.outputs.backend == 'true' && '✅ Changed' || '⏭️ Skipped' }} |
          | 📱 Frontend | ${{ needs.changes.outputs.frontend == 'true' && '✅ Changed' || '⏭️ Skipped' }} |
          | 🐳 Docker | ${{ needs.changes.outputs.docker == 'true' && '✅ Changed' || '⏭️ Skipped' }} |
          | 📚 Docs | ${{ needs.changes.outputs.docs == 'true' && '✅ Changed' || '⏭️ Skipped' }} |

          ---

          ## ✅ Summary

          Only relevant pipelines are executed based on detected changes.

          EOF

          cat /tmp/ci_dashboard.md >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment on PR (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const dashboard = fs.readFileSync(
              '/tmp/ci_dashboard.md', 'utf8'
            );
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: dashboard
            });
