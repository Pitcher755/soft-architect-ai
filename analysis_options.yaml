# analyzer configuration for monorepo testing
# This file helps the Dart analyzer resolve packages and files correctly

analyzer:
  exclude:
    - ".dart_tool/**"
    - "build/**"
    - "ios/**"
    - "android/**"
    - "web/**"
    - "macos/**"
    - "windows/**"
    - "linux/**"

  # Allow package:flutter imports to be resolved from src/client/pubspec.yaml
  plugins:
    - custom_lint

  # Ignore specific lint rules for legacy code and tests
  errors:
    # Ignore async io in tests and legacy code
    avoid_slow_async_io: ignore
    # Ignore avoid_catches_without_on_clauses for exception handling
    avoid_catches_without_on_clauses: ignore
    # Ignore line length for complex method calls and long strings
    lines_longer_than_80_chars: ignore
    # Ignore always_put_control_body_on_new_line (style preference)
    always_put_control_body_on_new_line: ignore

linter:
  rules:
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_returning_null
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - control_flow_in_finally
    - empty_statements
    - hash_and_equals
    - invariant_booleans
    - iterable_contains_unrelated_type
    - list_remove_unrelated_type
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_duplicate_case_values
    - prefer_void_to_null
    - throw_in_finally
    - unnecessary_statements
    - unrelated_type_equality_checks
