name: softarchitect_ai
description: Local-First AI Assistant for Software Architecture - MVP v0.1.0
version: 0.1.0+1
publish_to: 'none'

# ============================================================================
# ENVIRONMENT & PLATFORM CONFIGURATION
# Required: Dart SDK 3.10.9+ (stable) | Flutter 3.38.0+
# ============================================================================
environment:
  sdk: '>=3.10.8 <4.0.0'
  flutter: '>=3.38.0'

# ============================================================================
# APPLICATION DEPENDENCIES
# Core dependencies for Flutter application functionality
# ============================================================================
dependencies:
  flutter:
    sdk: flutter

  # UI & Material Design
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296

  # Localization & Internationalization
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^6.0.0

  # Markdown & Text Processing
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.0
  highlight: ^0.7.0

  # State Management & Routing
  flutter_riverpod: ^3.2.1
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.1.0

  # HTTP & Networking
  dio: ^5.9.1

  # Database & Storage
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0+2
  path_provider: ^2.1.5
  path: ^1.9.1

  # File Picking & System Interaction
  file_picker: ^10.3.10

  # Utilities & Cryptography
  json_serializable: ^6.11.2
  crypto: ^3.0.3
  logger: ^2.6.2

# ============================================================================
# DEVELOPMENT DEPENDENCIES
# Tools for building, testing, and code generation
# ============================================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation & Build Tools
  build_runner: ^2.10.5

  # Code Quality & Linting
  flutter_lints: ^6.0.0

  # Testing & Mocking
  mockito: ^5.6.3

  # Integration Testing
  integration_test:
    sdk: flutter

# ============================================================================
# FLUTTER CONFIGURATION
# Asset and font configuration
# ============================================================================
flutter:
  uses-material-design: true

  # Uncomment and configure when needed:
  # assets:
  #   - assets/images/
  #   - assets/data/
  #
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Italic.ttf
  #         style: italic
