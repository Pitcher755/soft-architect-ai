# ==============================================================================
# 🐳 SoftArchitect AI - Docker Compose Configuration
#
# EN: Infrastructure orchestration file.
#     Run with: docker compose --env-file ../.env up -d
# ES: Archivo de orquestación de infraestructura.
#     Ejecutar con: docker compose --env-file ../.env up -d
# ==============================================================================

services:
  # ==========================================================================
  # 🚀 FastAPI Backend Service / Servicio Backend FastAPI
  # EN: Main application server handling API requests, RAG logic, and LLMs.
  # ES: Servidor principal que maneja peticiones API, lógica RAG y LLMs.
  # ==========================================================================
  api-server:
    build:
      context: ../src/server
      dockerfile: Dockerfile
    container_name: sa_api
    # EN: Reads all variables directly from the master .env file at the root.
    # ES: Lee todas las variables automáticamente desde el .env maestro en la raíz.
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    environment:
      # EN: Hardcoded Docker-specific paths (Overrides .env if necessary).
      # ES: Rutas estáticas específicas de Docker (Sobrescriben al .env si es necesario).
      - KNOWLEDGE_BASE_PATH=/app/knowledge_base
      - OLLAMA_BASE_URL=http://sa_ollama:11434
      - CHROMADB_HOST=sa_chromadb
    volumes:
      - ./data/logs:/app/logs
      - ../src/server/app:/app/app
      - ../packages/knowledge_base:/app/knowledge_base
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - sa_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 8000), timeout=2)\"" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # 🧠 ChromaDB Vector Database / Base de Datos Vectorial
  # EN: Stores project embeddings and knowledge base for the RAG engine.
  # ES: Almacena embeddings del proyecto y base de conocimiento para el motor RAG.
  # ==========================================================================
  chromadb:
    image: chromadb/chroma:${CHROMADB_IMAGE_VERSION:-latest}
    container_name: sa_chromadb
    ports:
      - "8001:8000"
    environment:
      - CHROMA_DB_IMPL=duckdb
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - ./chroma_data:/data
    networks:
      - sa_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # 🦙 Ollama LLM Engine / Motor LLM Local
  # EN: Local AI provider. Consumes GPU if available and configured.
  # ES: Proveedor de IA local. Consume GPU si está disponible y configurada.
  # ==========================================================================
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_VERSION:-latest}
    container_name: sa_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
      # EN: Allow connection from other containers.
      # ES: Permitir conexión desde otros contenedores.
      - OLLAMA_ORIGINS=*
    networks:
      - sa_network
    restart: unless-stopped

    # ----------------------------------------------------------------------
    # EN: GPU Acceleration (NVIDIA). Comment this deploy block if using CPU only.
    # ES: Aceleración GPU (NVIDIA). Comenta este bloque 'deploy' si usas solo CPU.
    # ----------------------------------------------------------------------
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

# ==========================================================================
# 🌐 Docker Networks / Redes de Docker
# ==========================================================================
networks:
  sa_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# ==========================================================================
# 💾 Volumes (Data Persistence) / Volúmenes (Persistencia de Datos)
# ==========================================================================
volumes:
  ollama_data:
    driver: local
